server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the api container so the UI can use same-origin /api
  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://api:3000/health;
  }
}
